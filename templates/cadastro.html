<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Cadastro de Membro</title>

<style>

body{
font-family: Arial;
background:#f2f4f7;
padding:40px;
}

.container{
background:white;
width:420px;
margin:auto;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#1f4e79;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#173a5c;
}

</style>

</head>

<body>

<div class="container">

<h2>Cadastrar Membro</h2>

<form action="/salvar_membro" method="post" enctype="multipart/form-data">

<label>Nome</label>
<input type="text" name="nome" required>

<label>Telefone</label>
<input type="text" name="telefone">

<label>Endereço</label>
<input type="text" name="endereco">

<label>Foto</label>
<input type="file" name="foto">

<button type="submit">
Cadastrar
</button>

</form>

</div>

</body>

</html>
