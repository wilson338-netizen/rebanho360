<!DOCTYPE html>
<html>
<head>

<title>Rebanho 360</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
padding:30px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0px 0px 5px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h1>🐑 Rebanho 360</h1>
<h3>Organizando o povo de Deus</h3>

<div class="card">

<h2>Total de membros</h2>

<h1>{{ total }}</h1>

</div>

<div class="card">

<h2>🎂 Aniversariantes do mês</h2>

<ul>

{% for a in aniversariantes %}

<li>{{ a.nome }} - {{ a.data }}</li>

{% endfor %}

</ul>

</div>

<br>

<a href="/cadastro">➕ Cadastrar membro</a>

<br><br>

<a href="/painel">📋 Lista de membros</a>

</body>
</html>
